<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | HZ Steel</title>

    <style>
        

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #111820;
            color: white;
        }

        header {
            background-color: #080C10;
            padding: 20px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #D4AF37;
        }

        .logo {
            color: #D4AF37;
            font-size: 26px;
            font-weight: bold;
        }

        nav {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        nav a {
            color: #D4AF37;
            text-decoration: none;
            border: 1px solid #D4AF37;
            padding: 10px;
            white-space: nowrap;
        }

        nav a:hover {
            background-color: #D4AF37;
            color: #080C10;
        }

        main {
            padding: 60px 20px;
            text-align: center;
        }

        h1 {
            color: #D4AF37;
            font-size: 36px;
        }

        .contact-box {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background-color: #1C2732;
            border: 1px solid #D4AF37;
            border-radius: 8px;
        }

        .contact-box h2 {
            color: #D4AF37;
        }

        .contact-box p {
            font-size: 20px;
            line-height: 1.8;
        }

        .phone {
            color: #D4AF37;
            font-size: 24px;
            font-weight: bold;
            direction: ltr;
            display: inline-block;
            text-decoration: none;
        }

        footer {
            background-color: #080C10;
            color: #D4AF37;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            header {
                flex-wrap: wrap;
                gap: 15px;
            }

            nav {
                flex-wrap: wrap;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">HZ STEEL</div>

        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="products.html">منتجاتنا</a>
            <a href="contact.html ">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <p>يسعدنا تواصلكم مع شركة HZ Steel</p>

        <div class="contact-box">
            <h2>عنوان الشركة</h2>
            <p>السادس من أكتوبر، المنطقة الصناعية</p>

            <h2>أرقام التواصل</h2>
            <p>
                <a class="phone" href="tel:01021733964">
                    01021733964 -
                    01027154445
                </a>
            </p>
        </div>
    </main>

    <footer>
        HZ STEEL - جميع الحقوق محفوظة
    </footer>

</body>
</html>
